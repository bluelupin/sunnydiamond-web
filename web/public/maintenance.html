<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="60" />
    <title>Sunny Diamonds — We'll Be Right Back</title>
    <style>
      :root {
        --bg: #f6efe3;
        --text: #1e1e1e;
        --muted: #6b6b6b;
        --accent: #b8894e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
      }
      .card {
        max-width: 36rem;
        text-align: center;
      }
      .mark {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 0.75rem;
        border: 2px solid var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 0.05em;
      }
      .brand {
        font-size: 0.6875rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      h1 {
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        font-weight: 300;
        line-height: 1.15;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      button {
        font: inherit;
        font-size: 0.875rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 0.875rem 1.75rem;
        border: 1px solid var(--text);
        background: var(--text);
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .footer {
        margin-top: 2rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card" role="alert" aria-live="polite">
      <div class="mark" aria-hidden="true">SD</div>
      <p class="brand">Sunny Diamonds</p>
      <p class="badge">Temporary service interruption</p>
      <h1>We&rsquo;ll Be Right Back</h1>
      <p>
        We&rsquo;re updating the site with a new release. This page will refresh automatically
        when we&rsquo;re ready for you.
      </p>
      <button type="button" id="retry">Check again</button>
      <p class="footer">Thank you for your patience.</p>
    </main>
    <script>
      (function () {
        var retryButton = document.getElementById("retry");
        var checking = false;

        function goHome() {
          window.location.replace("/");
        }

        function checkStatus() {
          if (checking) return;
          checking = true;
          if (retryButton) retryButton.disabled = true;

          fetch("/api/maintenance/status", { cache: "no-store", credentials: "same-origin" })
            .then(function (response) {
              if (!response.ok) throw new Error("status");
              return response.json();
            })
            .then(function (data) {
              if (!data || !data.maintenance) {
                goHome();
              }
            })
            .catch(function () {
              /* Stay on maintenance page until status is reachable and maintenance is off. */
            })
            .finally(function () {
              checking = false;
              if (retryButton) retryButton.disabled = false;
            });
        }

        if (retryButton) {
          retryButton.addEventListener("click", checkStatus);
        }

        checkStatus();
        window.setInterval(checkStatus, 15000);
      })();
    </script>
  </body>
</html>
