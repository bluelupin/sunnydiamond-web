name: Deploy Staging to Forge

on:
  push:
    branches:
      - sunnydiamonds-staging

permissions:
  contents: read

concurrency:
  group: forge-sunnydiamonds-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and trigger Forge deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Call Forge deployment trigger
        shell: bash
        env:
          FORGE_DEPLOY_HOOK_URL: ${{ secrets.FORGE_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$FORGE_DEPLOY_HOOK_URL" ]]; then
            echo "Missing repository secret: FORGE_DEPLOY_HOOK_URL" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null \
            --get \
            --data-urlencode "forge_deploy_branch=$GITHUB_REF_NAME" \
            --data-urlencode "forge_deploy_commit=$GITHUB_SHA" \
            "$FORGE_DEPLOY_HOOK_URL"

          echo "Forge deployment requested for $GITHUB_REF_NAME at $GITHUB_SHA"
