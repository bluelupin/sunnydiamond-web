name: Deploy Staging to Forge

on:
  push:
    branches:
      - sunnydiamonds-staging

permissions:
  contents: read

concurrency:
  group: forge-sunnydiamonds-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and trigger Forge deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Verify TypeScript
        env:
          NEXT_PUBLIC_STRAPI_URL: https://sunnydiamonds-cms-dev.on-forge.com
          NEXT_PUBLIC_APP_ENV: qa
          NEXT_PUBLIC_FRONTEND_URL: https://sunnydiamonds-web-dev.on-forge.com
          NEXT_PUBLIC_SITE_URL: https://sunnydiamonds-cms-dev.on-forge.com
          NEXT_PUBLIC_API_DEBUG: false
          NEXT_PUBLIC_SENTRY_DSN: https://7c8f07734892ce19798997e0ec424a85@o191536.ingest.us.sentry.io/451184094576640
          NEXT_PUBLIC_MAGENTO_GRAPHQL_URL: https://sunnydiamond-store-dev.on-forge.com/graphql
          NEXT_PUBLIC_MAGENTO_STORE_CODE: default
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 1045895424883-qlhgd7r0smh8mj74fuvk5fukkihl45ui.apps.googleusercontent.com
        run: npx tsc --noEmit

      - name: Call Forge deployment trigger
        shell: bash
        env:
          FORGE_DEPLOY_HOOK_URL: ${{ secrets.FORGE_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "$FORGE_DEPLOY_HOOK_URL" ]]; then
            echo "Missing repository secret: FORGE_DEPLOY_HOOK_URL" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null \
            --get \
            --data-urlencode "forge_deploy_branch=$GITHUB_REF_NAME" \
            --data-urlencode "forge_deploy_commit=$GITHUB_SHA" \
            "$FORGE_DEPLOY_HOOK_URL"

          echo "Forge deployment requested for $GITHUB_REF_NAME at $GITHUB_SHA"
