name: Vercel PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    # Forks and Dependabot do not receive repository deployment credentials.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test deployment preflight
        run: node --test .github/scripts/vercel-preview-preflight.test.mjs

      - name: Verify and link the Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node .github/scripts/vercel-preview-preflight.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Build and deploy on Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: '1'
          PR_BRANCH: ${{ github.head_ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          vercel deploy --yes --non-interactive --target=preview \
            --local-config=web/vercel.json \
            --meta "githubDeployment=1" \
            --meta "githubCommitRef=$PR_BRANCH" \
            --meta "githubCommitSha=$PR_SHA" \
            --meta "githubPrId=$PR_NUMBER" \
            > "$RUNNER_TEMP/vercel-preview-url.txt"

          deployment_url="$(tr -d '\r\n' < "$RUNNER_TEMP/vercel-preview-url.txt")"
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a valid preview URL. Check the deployment logs."
            exit 1
          fi

          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '### Vercel preview\n\n[Open PR preview](%s)\n\nCommit: `%s`\n' \
            "$deployment_url" "$PR_SHA" >> "$GITHUB_STEP_SUMMARY"
